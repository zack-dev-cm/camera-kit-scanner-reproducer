name: Reproduce Camera Kit scanner ownership failures
on:
  push:
    branches: [main, reproducer/camera-kit-scanner]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install the pinned template and published library
        run: |
          npm install --global yarn@1.22.22
          yarn --cwd ReproducerApp install --frozen-lockfile --ignore-scripts
      - name: Require the intended original-implementation failures
        run: python3 reproduction/reproduce.py
      - name: Build the minimal template app
        working-directory: ReproducerApp/android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --console=plain --max-workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camera-kit-scanner-reproduction
          path: |
            evidence/
            ReproducerApp/android/app/build/outputs/apk/release/*.apk
